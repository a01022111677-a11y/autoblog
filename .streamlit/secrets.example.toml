# 로컬 실행용 템플릿입니다. 이 파일은 앱에 로드되지 않습니다.
# 실제 적용 방법:
#  - 로컬: 이 파일을 복사해 .streamlit/secrets.toml 로 저장한 뒤 "xxx"를 실제 값으로 교체
#  - Streamlit Cloud: 우측 하단 Manage app → Settings → Secrets에 아래 내용을 붙여넣기
#
# NAVER_API_KEY_ID = "xxx"
# NAVER_API_KEY = "xxx"
# GEMINI_API_KEY = "xxx"
# 네이버 쇼핑 가격비교용 (developers.naver.com → 애플리케이션 등록 → 검색 API)
# NAVER_CLIENT_ID = "xxx"
# NAVER_CLIENT_SECRET = "xxx"
TOSS_ACCESS_KEY = "xxx"
TOSS_SECRET_KEY = "xxx"
TOSS_PUBLISHER_ID = "xxx"
# 상품 개수 (1~5), 토스 박스 강제 off는 "false"
# TOSS_PRODUCT_COUNT = "3"
# TOSS_ENABLED = "true"
# Cloud IP차단 시 고정IP 프록시 경유 (QuotaGuard/Fixie 등 개통 후 URL 입력)
# TOSS_HTTPS_PROXY = "http://user:pass@proxy-host:8080"
#
# [중계서버 모드: 집PC에서 relay_server.py 실행 시 — Cloud에는 이 2줄만 있으면 됨]
#  1) 집PC .env에 토스 키 3종 + RELAY_SECRET=긴랜덤문자열 저장
#  2) 집PC 공인IP를 토스 어드민 출발지 IP에 등록 (최대 10개)
#  3) 집PC에서: python relay_server.py --port 8000
#  4) cloudflared tunnel --url http://localhost:8000 → 나온 https URL을 아래에
# TOSS_RELAY_URL = "https://xxx.trycloudflare.com"
# TOSS_RELAY_SECRET = "집PC RELAY_SECRET과 동일한 값"
